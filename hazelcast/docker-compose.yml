version: '3.8'
networks:
  hz-net:
    driver: bridge

services:
  middleware:
    image: hazelcast/hazelcast:5.3.0
    hostname: hz-middleware
    container_name: hz-middleware
    ports:
      - "5701-5705:5701-5705"
    environment:
      - HZ_CLUSTERNAME=dev
      - HZ_NETWORK_PUBLICADDRESS=hz-middleware
    networks:
      - hz-net

  api-gateway:
    build: ./api-gateway
    environment:
      - HZ_HOST=hz-middleware
      - HZ_PORT=5701
      - HZ_CLUSTERNAME=dev
    ports:
      - "5000:5000"
    depends_on:
      - middleware
    networks:
      - hz-net

  processing-unit:
    build: ./processing-unit
    environment:
      - HZ_HOST=hz-middleware
      - HZ_PORT=5701
      - HZ_CLUSTERNAME=dev
    depends_on:
      middleware:
        condition: service_healthy
    networks:
      - hz-net