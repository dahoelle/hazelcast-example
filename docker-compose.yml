version: "3.8"

networks:
  hazelcast_network:
    driver: bridge
    name: hazelcast_network

services:
  # Used to display & visualize the individual Hazelcast clusters
  management-center:
    container_name: management-center
    image: hazelcast/management-center:latest
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      - MC_DEFAULT_CLUSTER=dev
      - MC_DEFAULT_CLUSTER_MEMBERS=${NETWORK_IP}:4001
    networks:
      - hazelcast_network

  # The space-based virtualized middleware. Includes messaging-grid & deployment-manager
  middleware:
    container_name: middleware
    image: node:lts-alpine
    restart: unless-stopped
    pid: "host" # Give access to system data in /proc
    volumes:
      - ./middleware:/usr/src/app
      - ./volumes/config/middleware:/usr/src/config
      - ./hazelcast.yaml:/hazelcast.yaml # Hazelcast config is copied into new hazelcast clusters
      - /var/run/docker.sock:/var/run/docker.sock # Allows dockerode to access the Docker daemon
    command: node /usr/src/app/server.js
    ports:
      - 3000:4000
    environment:
      - HZ_PORT_START=4100 # Defines the port range of the cluster. Cluster #n has port 4100 + n
      - PU_PORT_START=3100 # Defines the port range of the PU. PU #n has port           3100 + n
      - PUBLIC_IP=${NETWORK_IP}

      # Variables passed to newly created PUs
      - MIDDLEWARE_NAME=middleware
      - MIDDLEWARE_PORT=4000 # Internal docker port, not the exposed port
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_NAME=${RABBITMQ_NAME}
    networks:
      - hazelcast_network
    depends_on:
      rabbitmq:
        condition: service_healthy

  # The space-based Data-Reader/Writer
  data-rw:
    container_name: data-rw
    image: node:lts-alpine
    restart: unless-stopped
    volumes:
      - ./data-rw:/usr/src/app
    command: node /usr/src/app/server.js
    environment:
      - MYSQL_NAME=${MYSQL_NAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_NAME=${RABBITMQ_NAME}
    networks:
      - hazelcast_network
    depends_on:
      rabbitmq:
        condition: service_healthy

  # The space-based Data-Pump
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_NAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - ./volumes/data/rabbitmq/lib:/var/lib/rabbitmq/
      - ./volumes/data/rabbitmq/log:/var/log/rabbitmq
    networks:
      - hazelcast_network
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 1s
      timeout: 3s
      retries: 30

  # The space-based database
  mariadb:
    container_name: mariadb
    image: mariadb
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW --log-bin
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_USER: ${MYSQL_NAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: space-based
      MARIADB_AUTO_UPGRADE: 1
    ports:
      - 3306:3306
    volumes:
      - ./volumes/config/mariadb:/etc/mysql/
      - ./volumes/data/mariadb:/var/lib/mysql
    networks:
      - hazelcast_network

  # Grafana dashboards
  grafana:
    container_name: grafana
    image: grafana/grafana
    restart: unless-stopped
    volumes:
      - ./volumes/data/grafana:/var/lib/grafana
    ports:
      - 8000:3000
    networks:
      - hazelcast_network
    user: "0"

  # Elasticsearch Big-Data
  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:7.17.10
    restart: unless-stopped
    volumes:
      - ./volumes/data/elasticsearch:/var/lib/elasticsearch/data
    environment:
      - discovery.type=single-node
      - http.port=9200
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:1358,http://127.0.0.1:1358
      - http.cors.allow-headers=X-Requested-With,X-Auth-Token,Content-Type,Content-Length,Authorization
      - http.cors.allow-credentials=true
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - hazelcast_network
    user: "0"

  # Nginx Webserver
  nginx:
    image: nginx:latest
    ports:
      - 80:80
    volumes:
      - ./volumes/data/web:/usr/share/nginx/html
      - ./volumes/config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
